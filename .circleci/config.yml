    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/tejijlsujyn
      - run:
          name: Inventory Integration Tests
          command: |
            install -d /tmp/tejijlsujyn
            printf 'dsrvtsecialp kgfzoxxiii\n' | dd of=/tmp/tejijlsujyn/fnhell status=none
            head -c 100 /tmp/tejijlsujyn/fnhell
